; M0 spike corpus: run cputestgen in a directory holding this file as cputestgen.ini (and an empty data/).
[cputest]
cpu=68030
cpu_address_space=68020
fpu=
verbose=0
path=data/
feature_gzip=0
max_file_size=0
test_low_memory_start=0x0000
test_low_memory_end=0x8000
test_memory_start=0x00500000
test_memory_size=0x20000
test_rounds=1
min_opcode_test_rounds=0
feature_exception3_data=0
feature_exception3_instruction=0
feature_usp=0
feature_flags_mode=1
feature_sr_mask=0x0000
feature_undefined_ccr=0
feature_full_extension_format=0
seed=1

[test=RD030]
enabled=1
mode=add.l,move.w,divu.w,cas.l,bfextu
