;
; The `make cputest` corpus: WinUAE's cputestgen, run for the MC68030 over the
; whole integer instruction set it knows (mode=all), with no FPU and no MMU
; instructions (cputest has neither for a 68030).
;
; The memory map is the one sim/tb/core_cputest_tb.sv gives the core, and fits
; the core harness's 64 KB 32-bit port (a larger port takes iverilog minutes per
; doubling to elaborate):
;   $0000-$7FFF  low memory, reachable by (xxx).W
;   $8000-$FFFF  test memory: the instructions, operands and both stacks
; (other splits of the 64 KB make the generator abort on RTS, RTD, RTR and RTE)
; The bench keeps its vector table and handlers on the 16-bit port at
; $1000_0000, where no generated address can reach.
;
; `make cputest` copies this file into build/cputest/ as cputestgen.ini and runs
; the generator there; CPUTEST_INI= replaces it.
[cputest]
cpu=68030
cpu_address_space=68020
fpu=
verbose=0
path=data/
feature_gzip=0
max_file_size=0
test_low_memory_start=0x0000
test_low_memory_end=0x8000
test_memory_start=0x8000
test_memory_size=0x8000
test_rounds=1
min_opcode_test_rounds=0
feature_exception3_data=0
feature_exception3_instruction=0
feature_usp=0
; all zeros and all ones CCR (Xcc instructions still get all 32)
feature_flags_mode=1
; no extra T/S/M rounds; privileged instructions get their S=1 round anyway
feature_sr_mask=0x0000
; the generator's own masks for the flags PRM 4 leaves undefined (DIVx, CHK,
; CHK2). Its readme says 1 turns them on; the generator emits them for 0.
feature_undefined_ccr=0
feature_full_extension_format=0
; seed 1 sends the generator into an endless retry on OR.L (d16,A7)
seed=2

; The integer instruction set, MC68000 addressing modes.
[test=RD030]
enabled=1
mode=all

; No set with feature_full_extension_format: with this memory map the generator
; finds no effective address for most instructions in that mode (LEA, ADD.W and
; CMP.B came out empty), and `make ea` sweeps those modes against the same
; oracle already.
